name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y verificar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar plataforma y build-tools (el runner ya trae el SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias de la lógica de cálculo
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK debug (firmado con clave debug, instalable)
        run: ./gradlew --no-daemon assembleDebug

      - name: Verificar contenido del APK (MainActivity compilada, launcher, sin INTERNET)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          BT="$ANDROID_HOME/build-tools/34.0.0"

          echo "--- aapt2 dump badging"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^package:|launchable-activity|uses-permission|minSdkVersion|targetSdkVersion" badging.txt || true

          grep -q "package: name='cl.erretrez.calculadora'" badging.txt \
            || { echo "FALLO: paquete inesperado"; exit 1; }
          grep -q "launchable-activity: name='cl.erretrez.calculadora.MainActivity'" badging.txt \
            || { echo "FALLO: MainActivity no es la actividad launcher"; exit 1; }
          if grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt; then
            echo "FALLO: el APK declara permiso INTERNET"; exit 1
          fi

          echo "--- MainActivity dentro de classes.dex"
          mkdir -p dexcheck && rm -rf dexcheck/*
          unzip -q -o "$APK" 'classes*.dex' -d dexcheck
          FOUND=0
          for dex in dexcheck/classes*.dex; do
            if "$BT/dexdump" "$dex" 2>/dev/null | grep -q "Class descriptor.*Lcl/erretrez/calculadora/MainActivity;"; then
              echo "OK: MainActivity definida en $dex"; FOUND=1
            fi
          done
          [ "$FOUND" = "1" ] || { echo "FALLO: MainActivity no está compilada en el APK"; exit 1; }

          for cls in CostCalculator Field CostInputs CostBreakdown; do
            grep -qa "Lcl/erretrez/calculadora/$cls;" dexcheck/classes*.dex \
              || { echo "FALLO: falta la clase $cls en el APK"; exit 1; }
          done

          echo "--- firma"
          "$BT/apksigner" verify --verbose "$APK" | head -5

          cp "$APK" CalculadoraCostos3D-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalculadoraCostos3D-apk
          path: CalculadoraCostos3D-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-de-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore

  emulator-test:
    name: Instalar y abrir en emulador Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CalculadoraCostos3D-apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar, abrir y probar la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: bash scripts/emulator-smoke-test.sh CalculadoraCostos3D-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-emulador
          path: evidence/
          if-no-files-found: ignore

  release:
    name: Publicar APK en Releases
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CalculadoraCostos3D-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK más reciente
          body: |
            APK debug instalable, compilado automáticamente desde `main`
            (commit ${{ github.sha }}).
          files: CalculadoraCostos3D-debug.apk
          make_latest: true
