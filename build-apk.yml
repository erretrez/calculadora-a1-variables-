name: Construir APK Android

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: |
          mkdir -p proyecto
          unzip -o Proyecto_Android_Calculadora3D_A1.zip -d proyecto
          cp -a proyecto/app ./app
          cp proyecto/build.gradle.kts ./build.gradle.kts
          cp proyecto/settings.gradle.kts ./settings.gradle.kts
          cp proyecto/gradle.properties ./gradle.properties

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora3D-A1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
